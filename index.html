<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Daily English Reader</title>
    <meta name="description" content="매일 영어 기사 한 편을 읽고, 단어를 눌러 문맥 뜻을 보고, 간격 반복으로 복습하는 개인용 영어 학습 앱" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DE Reader" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="stylesheet" href="css/app.css" />
    <script src="js/boot.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">본문으로 건너뛰기</a>

    <div id="banners" aria-live="polite"></div>

    <main id="view" tabindex="-1">
      <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>불러오는 중…</div>
    </main>

    <nav id="tabs" aria-label="주 메뉴">
      <a href="#/today" data-tab="today"><span class="tab-icon" aria-hidden="true">📰</span><span class="tab-label">오늘</span></a>
      <a href="#/vocab" data-tab="vocab"><span class="tab-icon" aria-hidden="true">📚</span><span class="tab-label">단어장</span></a>
      <a href="#/review" data-tab="review">
        <span class="tab-icon" aria-hidden="true">🔁</span><span class="tab-label">복습</span>
        <span class="tab-badge" id="review-badge" hidden></span>
      </a>
      <a href="#/settings" data-tab="settings"><span class="tab-icon" aria-hidden="true">⚙️</span><span class="tab-label">설정</span></a>
    </nav>

    <div id="offline-chip" class="offline-chip" hidden>오프라인</div>
    <div id="toasts" aria-live="polite"></div>

    <noscript>
      <p class="noscript">Daily English Reader를 쓰려면 브라우저의 자바스크립트를 켜 주세요.</p>
    </noscript>

    <script src="vendor/ts-fsrs.umd.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
